    <style>
      :root {
        --app-boot-bg: radial-gradient(
            circle at top,
            rgba(90, 79, 207, 0.14),
            transparent 38%
          ),
          linear-gradient(180deg, #fff8ef 0%, #ffffff 58%, #f8f9ff 100%);
        --app-boot-text: #2d3436;
        --app-boot-muted: #636e72;
        --app-boot-accent: #f39c12;
        --app-boot-accent-soft: rgba(243, 156, 18, 0.14);
        --app-boot-shadow: 0 20px 60px rgba(45, 52, 54, 0.08);
      }

      #app-boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--app-boot-bg);
        transition: opacity 0.28s ease, visibility 0.28s ease;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #app-boot-loading.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #app-boot-loading.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-boot-card {
        width: min(420px, calc(100vw - 48px));
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.72);
        box-shadow: var(--app-boot-shadow);
        backdrop-filter: blur(14px);
        text-align: center;
      }

      .app-boot-mark {
        min-width: 52px;
        height: 52px;
        padding: 0 16px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          rgba(243, 156, 18, 0.18),
          rgba(90, 79, 207, 0.12)
        );
        color: var(--app-boot-accent);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-decoration: none;
      }

      .app-boot-title {
        margin: 0;
        color: var(--app-boot-text);
        font-size: 18px;
        font-weight: 600;
        line-height: 1.4;
      }

      .app-boot-tip {
        margin: 10px 0 0;
        color: var(--app-boot-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .app-boot-progress {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--app-boot-accent-soft);
        color: var(--app-boot-accent);
        font-size: 13px;
        font-weight: 600;
      }

      .app-boot-progress-track {
        position: relative;
        width: min(180px, 42vw);
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(243, 156, 18, 0.16);
      }

      .app-boot-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(243, 156, 18, 0.72),
          rgba(243, 156, 18, 1)
        );
        box-shadow: 0 0 16px rgba(243, 156, 18, 0.3);
        transition: width 0.24s ease;
      }

      .app-boot-progress-value {
        min-width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .app-boot-note {
        margin-top: 14px;
        color: rgba(99, 110, 114, 0.84);
        font-size: 12px;
        line-height: 1.5;
      }

      #seo-content {
        max-width: 1120px;
        margin: 0 auto;
        padding: 48px 24px 88px;
        color: #1f2937;
      }

      #seo-content a {
        color: #5a4fcf;
        text-decoration: none;
      }

      #seo-content a:hover {
        text-decoration: underline;
      }

      .seo-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        gap: 24px;
        align-items: start;
        margin-bottom: 36px;

      .seo-hero-copy p {
        margin: 0 0 14px;

      .seo-badges,

      .seo-badges {

        margin-top: 18px;
      }

      .seo-badges li {
        padding: 8px 12px;
        border-radius: 999px;
        background: #fff4df;
        color: #ad6800;
        font-size: 14px;
        font-weight: 600;
      }

      .seo-panel {
        border: 1px solid rgba(90, 79, 207, 0.14);
        border-radius: 24px;
        padding: 24px;
        background: linear-gradient(180deg, #ffffff 0%, #faf8ff 100%);

      .seo-panel h2,

        color: #121826;
      }

      .seo-panel p,

        margin: 0 0 12px;
        line-height: 1.8;
        color: #475569;
      }

      .seo-card-links li + li,

      }

      .seo-card-links a {
        display: block;
        padding: 14px 16px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid rgba(90, 79, 207, 0.12);
      }

      .seo-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 36px;
      }

      .seo-grid article,
      .seo-faq-list li {
        border-radius: 20px;
        border: 1px solid #e8ebf3;
        background: #ffffff;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      }

      .seo-grid h3,
      .seo-faq-list h3 {
        margin: 0 0 10px;
        font-size: 18px;
        color: #121826;
      }

      .seo-section {
        margin-bottom: 36px;
      }

      .seo-inline-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
      }

      html.app-ready #seo-content {
        display: none;
      }

      html.app-boot-error .app-boot-progress {
        background: rgba(233, 30, 99, 0.1);
        color: #e91e63;
      }

      html.app-boot-error .app-boot-progress-track {
        background: rgba(233, 30, 99, 0.16);
      }

      html.app-boot-error .app-boot-progress-fill {
        background: linear-gradient(
          90deg,
          rgba(233, 30, 99, 0.72),

      @media (max-width: 640px) {
        .app-boot-card {

        .seo-grid {
          grid-template-columns: 1fr;
        }

          padding: 32px 20px 64px;

    <script>
      (function () {
        var bootReady = false;
        var bootProgress = 0;
        var simulationStartAt = Date.now();
        var simulationTimer = 0;
        var slowTipTimer = window.setTimeout(function () {
          var tip = document.querySelector('[data-app-boot-tip]');
          if (tip) {
            tip.textContent =
              '首次打开或网络较慢时会多等一会，正在努力准备中...';
          }
        }, 4000);
        var removeTimer = 0;
        var cdnConfigLoadStarted = false;
        var resolveMainEntryReady = null;
        var BOOT_CDN_PACKAGE_NAME = 'new-api-creative';
        var BOOT_CDN_BASE_URL = '';
        var BOOT_LOCAL_RETRY_STORAGE_KEY = '__OPENTU_BOOT_LOCAL_RETRY_AT__';
        var BOOT_IMPORT_RETRY_STORAGE_KEY = '__OPENTU_BOOT_IMPORT_RETRY_AT__';
        var BOOT_SW_DISABLED_RELOAD_STORAGE_KEY =
          '__OPENTU_BOOT_SW_DISABLED_RELOAD_AT__';
        var BOOT_LOCAL_RETRY_TTL_MS = 2 * 60 * 1000;
        var BOOT_SW_DISABLED_RELOAD_TTL_MS = 60 * 1000;
        var BOOT_MANAGED_SCRIPT_TIMEOUT_MS = 3500;
        var forceLocalBootAssets = true;
        window.__OPENTU_START_MAIN_ENTRY__ = new Promise(function (resolve) {
          resolveMainEntryReady = resolve;
        });

        (function setupOfficialSiteLink() {
          try {
            var officialSiteLink = document.querySelector(
              '[data-official-site-link]'
            );
            if (!officialSiteLink) {
              return;
            }

            if (window.location.hostname.toLowerCase() === 'new-api.local') {
              officialSiteLink.removeAttribute('href');
              officialSiteLink.addEventListener('click', function (event) {
                event.preventDefault();
              });
            }
          } catch (error) {
            // 启动页兜底逻辑不能影响主应用加载。
          }
        })();

        (function initializeBootLocalRetryFlag() {
          try {
            var retryAtRaw = window.sessionStorage.getItem(
              BOOT_LOCAL_RETRY_STORAGE_KEY
            );
            if (!retryAtRaw) {
              return;
            }

            var retryAt = Number(retryAtRaw);
            if (
              !isFinite(retryAt) ||
              Date.now() - retryAt > BOOT_LOCAL_RETRY_TTL_MS
            ) {
              window.sessionStorage.removeItem(BOOT_LOCAL_RETRY_STORAGE_KEY);
              return;
            }

            forceLocalBootAssets = true;
          } catch (_error) {
            forceLocalBootAssets = false;
          }
        })();

        function clearBootLocalRetryFlag() {
          forceLocalBootAssets = false;
          try {
            window.sessionStorage.removeItem(BOOT_LOCAL_RETRY_STORAGE_KEY);
            window.sessionStorage.removeItem(BOOT_IMPORT_RETRY_STORAGE_KEY);
          } catch (_error) {
            // ignore sessionStorage cleanup failures
          }
        }

        function scheduleBootSelfHealReload() {
          if (isBootLocalDevelopment() || forceLocalBootAssets) {
            return false;
          }

          try {
            window.sessionStorage.setItem(
              BOOT_LOCAL_RETRY_STORAGE_KEY,
              String(Date.now())
            );
          } catch (_error) {
            return false;
          }

          var tip = document.querySelector('[data-app-boot-tip]');
          if (tip) {
            tip.textContent = '首屏资源回退中，正在自动重试...';
          }
          window.location.reload();
          return true;
        }

        function isRecoverableBootImportError(error) {
          var message =
            error && typeof error.message === 'string'
              ? error.message
              : String(error || '');

          return (
            /Failed to fetch dynamically imported module/i.test(message) ||
            /Importing a module script failed/i.test(message) ||
            /Loading chunk [\w-]+ failed/i.test(message) ||
            /ChunkLoadError/i.test(message)
          );
        }

        function hasBootImportRetryParam() {
          try {
            return new URLSearchParams(window.location.search).has(
              '_lazy_chunk_retry'
            );
          } catch (_error) {
            return window.location.search.indexOf('_lazy_chunk_retry=') !== -1;
          }
        }

        function createBootImportRecoveryUrl() {
          var recoveryUrl = new URL(window.location.href);
          recoveryUrl.searchParams.set('_lazy_chunk_retry', '1');
          recoveryUrl.searchParams.set('_t', String(Date.now()));
          return recoveryUrl.toString();
        }

        function prepareBootImportRecovery() {
          var tasks = [];

          try {
            if (
              navigator.serviceWorker &&
              navigator.serviceWorker.controller
            ) {
              navigator.serviceWorker.controller.postMessage({
                type: 'RECOVER_DYNAMIC_IMPORT_FAILURE',
                appVersion: getBootAppVersion(),
                moduleKey: 'boot-main-entry',
              });
            }
          } catch (_error) {
            // ignore best-effort SW notification failures
          }

          try {
            if (window.caches && typeof window.caches.keys === 'function') {
              tasks.push(
                window.caches.keys().then(function (cacheNames) {
                  return Promise.all(
                    cacheNames
                      .filter(function (name) {
                        return name.indexOf('drawnix-static-v') === 0;
                      })
                      .map(function (name) {
                        return window.caches.delete(name);
                      })
                  );
                })
              );
            }
          } catch (_error) {
            // ignore cache cleanup failures
          }

          return Promise.allSettled(tasks);
        }

        window.__OPENTU_BOOT_DYNAMIC_IMPORT_RECOVERY__ = function (error) {
          if (!isRecoverableBootImportError(error) || isBootLocalDevelopment()) {
            return false;
          }

          try {
            var lastRetryAt = Number(
              window.sessionStorage.getItem(BOOT_IMPORT_RETRY_STORAGE_KEY)
            );
            if (
              isFinite(lastRetryAt) &&
              Date.now() - lastRetryAt <= BOOT_LOCAL_RETRY_TTL_MS
            ) {
              return false;
            }
            window.sessionStorage.setItem(
              BOOT_IMPORT_RETRY_STORAGE_KEY,
              String(Date.now())
            );
          } catch (_error) {
            if (hasBootImportRetryParam()) {
              return false;
            }
          }

          var recoveryUrl = createBootImportRecoveryUrl();
          var didReload = false;
          var reload = function () {
            if (didReload) {
              return;
            }
            didReload = true;
            window.location.replace(recoveryUrl);
          };

          var tip = document.querySelector('[data-app-boot-tip]');
          if (tip) {
            tip.textContent = '启动资源已更新，正在自动刷新恢复...';
          }

          window.setTimeout(reload, 700);
          prepareBootImportRecovery().then(reload, reload);
          return true;
        };

        function clearBootTimers() {
          if (slowTipTimer) {
            window.clearTimeout(slowTipTimer);
            slowTipTimer = 0;
          }
          if (removeTimer) {
            window.clearTimeout(removeTimer);
            removeTimer = 0;
          }
          if (simulationTimer) {
            window.clearInterval(simulationTimer);
            simulationTimer = 0;
          }
        }

        function getBootRoot() {
          return document.getElementById('app-boot-loading');
        }

        function getBootAppVersion() {
          var versionMeta = document.querySelector('meta[name="app-version"]');
          return versionMeta
            ? versionMeta.getAttribute('content') || '0.0.0'
            : '0.0.0';
        }

        function isBootLocalDevelopment() {
          return (
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname.endsWith('.localhost')
          );
        }

        function toPreferredBootAssetUrl(localPath) {
          if (!localPath || isBootLocalDevelopment() || forceLocalBootAssets) {
            return localPath;
          }

          var normalizedPath = String(localPath).trim();

          if (/^https?:\/\//i.test(normalizedPath)) {
            return normalizedPath;
          }

          normalizedPath = normalizedPath
            .replace(/^\.?\//, '')
            .replace(/^npm\/new-api-creative@[^/]+\//, '')
            .replace(/^new-api-creative@[^/]+\//, '');

          return (
            BOOT_CDN_BASE_URL +
            BOOT_CDN_PACKAGE_NAME +
            '@' +
            getBootAppVersion() +
            '/' +
            normalizedPath
          );
        }

        function isManagedBootFallbackTarget(target) {
          return !!(
            target &&
            typeof target.getAttribute === 'function' &&
            target.getAttribute('data-cdn-fallback-managed') === '1'
          );
        }

        function createLocalBootAssetNode(target, localUrl) {
          var replacement = target.cloneNode(false);
          replacement.setAttribute('data-fallback-attempted', '1');
          replacement.removeAttribute('onerror');

          var failureMessage =
            target.tagName === 'SCRIPT'
              ? '首屏脚本加载失败，请刷新页面后重试。'
              : target.getAttribute('rel') === 'stylesheet'
              ? '首屏样式加载失败，请刷新页面后重试。'
              : '首屏资源加载失败，请刷新页面后重试。';

          if (target.tagName === 'SCRIPT') {
            replacement.setAttribute('src', localUrl);
            replacement.onerror = function () {
              markError(failureMessage);
            };
            return replacement;
          }

          replacement.setAttribute('href', localUrl);
          replacement.onerror = function () {
            markError(failureMessage);
          };
          return replacement;
        }

        window.__OPENTU_BOOT_ASSET_FALLBACK__ = function (target) {
          if (!target) {
            return false;
          }

          var localUrl =
            target.getAttribute('data-local-src') ||
            target.getAttribute('data-local-href');

          if (!localUrl) {
            return false;
          }

          if (target.getAttribute('data-fallback-attempted') === '1') {
            markError(
              target.tagName === 'SCRIPT'
                ? '首屏脚本加载失败，请刷新页面后重试。'
                : target.getAttribute('rel') === 'stylesheet'
                ? '首屏样式加载失败，请刷新页面后重试。'
                : '首屏资源加载失败，请刷新页面后重试。'
            );
            return true;
          }

          if (
            target.tagName === 'SCRIPT' &&
            target.getAttribute('type') === 'module' &&
            scheduleBootSelfHealReload()
          ) {
            return true;
          }

          var replacement = createLocalBootAssetNode(target, localUrl);
          if (target.parentNode) {
            target.parentNode.replaceChild(replacement, target);
          }
          return true;
        };

        function appendManagedBootScript(localPath, onload, onfinalerror) {
          var preferredUrl = toPreferredBootAssetUrl(localPath);
          var script = document.createElement('script');
          script.async = true;
          script.setAttribute('data-cdn-fallback-managed', '1');
          script.setAttribute('data-local-src', localPath);
          var settled = false;
          var timeoutId = window.setTimeout(function () {
            if (settled) {
              return;
            }
            settled = true;
            console.warn(
              '[Boot] Managed boot script timed out, continuing with local bootstrap:',
              localPath
            );
            handleFinalFailure();
          }, BOOT_MANAGED_SCRIPT_TIMEOUT_MS);

          var handleFinalFailure = function () {
            if (typeof onfinalerror === 'function') {
              onfinalerror();
            }
          };
          var settle = function (callback) {
            if (settled) {
              return;
            }
            settled = true;
            window.clearTimeout(timeoutId);
            if (typeof callback === 'function') {
              callback();
            }
          };
